<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener - 빠르고 스마트한 URL 단축기</title>
  <meta name="description" content="긴 URL 주소를 짧고 간결한 링크로 즉시 단축하고 손쉽게 복사할 수 있는 웹 서비스">
  
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for modern icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Animated Gradient Orbs & Grid -->
  <div class="bg-decoration">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-pattern"></div>
  </div>

  <!-- Top Global Header & Navigation -->
  <header class="app-header">
    <div class="logo-wrapper">
      <a href="../index.html" class="logo-link" title="메인 허브로 이동">
        <div class="brand-badge">
          <i class="fa-solid fa-link"></i>
        </div>
        <span class="brand-title">URL Shortener</span>
      </a>
    </div>

    <!-- Navigation Switch Tabs: QR코드 & URL단축 -->
    <nav class="nav-switch-tabs" aria-label="서비스 전환">
      <a href="../url2qr/index.html" class="tab-btn" id="nav-btn-qr" title="QR코드 생성기로 이동">
        <i class="fa-solid fa-qrcode"></i>
        <span>QR코드</span>
      </a>
      <a href="index.html" class="tab-btn active" id="nav-btn-short" title="URL 단축기 (현재 페이지)">
        <i class="fa-solid fa-scissors"></i>
        <span>URL단축</span>
      </a>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="app-container">
    
    <!-- Hero / Header Section -->
    <section class="hero-section">
      <div class="hero-pill">
        <i class="fa-solid fa-bolt"></i>
        <span>OpenAPI 실시간 단축 엔진</span>
      </div>
      <h1 class="hero-title">길고 복잡한 링크를 <span class="gradient-text">한 번에 단축</span>하세요</h1>
      <p class="hero-subtitle">공유하기 쉬운 깔끔한 단축 URL을 즉시 생성하고 원클릭으로 클립보드에 복사할 수 있습니다.</p>
    </section>

    <!-- Main Card Box -->
    <section class="shortener-card">
      <form id="shorten-form" class="shortener-form" onsubmit="return false;">
        
        <!-- 3-1: URL 입력창 Section -->
        <div class="form-group">
          <label for="url-input" class="input-label">
            <i class="fa-solid fa-globe"></i> 단축할 원본 URL 입력
          </label>
          <div class="input-wrapper">
            <i class="fa-solid fa-arrow-turn-down input-icon"></i>
            <input 
              type="url" 
              id="url-input" 
              class="url-input" 
              placeholder="https://example.com/very/long/path/with/parameters" 
              autocomplete="off"
              spellcheck="false"
              required
            >
            <button type="button" id="clear-btn" class="clear-btn" title="입력 지우기" aria-label="입력 지우기">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <span class="input-hint">
            <i class="fa-solid fa-circle-info"></i> 단축하고 싶은 인터넷 주소를 붙여넣거나 입력해 주세요.
          </span>
        </div>

        <!-- 3-1 & 3-2: 단축하기 버튼 (비어 있으면 disabled) -->
        <div class="action-row">
          <button type="submit" id="shorten-btn" class="shorten-btn" disabled>
            <span class="btn-spinner" id="btn-spinner" aria-hidden="true">
              <i class="fa-solid fa-circle-notch fa-spin"></i>
            </span>
            <span class="btn-text" id="btn-text">
              <i class="fa-solid fa-wand-magic-sparkles"></i> 단축하기
            </span>
          </button>
        </div>

      </form>

      <!-- 3-1 & 3-3 & 3-4: 단축 결과 출력 상자 & 복사 버튼 -->
      <div class="result-section" id="result-section">
        <div class="result-header">
          <label for="short-url-output" class="output-label">
            <i class="fa-solid fa-circle-check"></i> 단축된 URL 결과
          </label>
          <span class="status-badge" id="status-badge">생성 완료</span>
        </div>

        <div class="output-wrapper">
          <i class="fa-solid fa-link-slash output-icon"></i>
          <!-- 3-1: 읽기 전용 출력 상자 -->
          <input 
            type="text" 
            id="short-url-output" 
            class="short-url-output" 
            readonly 
            placeholder="단축하기 버튼을 누르면 여기에 생성됩니다"
            value=""
          >
          <!-- 3-4: 복사 버튼 -->
          <button type="button" id="copy-btn" class="copy-btn" title="단축 URL 클립보드에 복사" disabled>
            <i class="fa-regular fa-copy"></i>
            <span>복사</span>
          </button>
        </div>

        <!-- 부가 액션 툴바 (바로가기 & QR코드 변환 연계) -->
        <div class="result-actions" id="result-actions">
          <a href="#" id="visit-link-btn" class="action-chip" target="_blank" rel="noopener noreferrer">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> 새 창에서 열기
          </a>
          <a href="#" id="qr-convert-btn" class="action-chip qr-chip">
            <i class="fa-solid fa-qrcode"></i> 이 단축 URL로 QR코드 만들기
          </a>
        </div>
      </div>

      <!-- 에러 알림 상자 (API 실패 시 부드럽게 안내) -->
      <div class="error-banner" id="error-banner" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="error-message">URL 단축 중 문제가 발생했습니다. 다시 시도해 주세요.</span>
      </div>

    </section>

  </main>

  <!-- 3-4: '복사하였습니다' 토스트 알림창 -->
  <div class="toast-notification" id="toast-notification" role="status" aria-live="polite">
    <div class="toast-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="toast-content">
      <p class="toast-title">복사하였습니다</p>
      <p class="toast-desc">단축된 URL이 클립보드에 안전하게 복사되었습니다.</p>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
