<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Studio - 간편하고 세련된 QR코드 생성기</title>
  <meta name="description" content="URL을 입력하여 손쉽게 QR코드를 생성하고 JPG 파일로 즉시 다운로드할 수 있는 웹 서비스">
  
  <!-- Google Fonts: Pretendard 대체 및 Inter, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for modern icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Glow & Grid Effect -->
  <div class="bg-decoration">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-pattern"></div>
  </div>

  <!-- Top Header -->
  <header class="app-header">
    <div class="logo-wrapper">
      <a href="../index.html" class="logo-home-link" title="메인 허브로 이동">
        <img src="img/logo.png" alt="QR Code Studio Logo" class="brand-logo" id="brand-logo">
        <span class="brand-title">QR Studio</span>
      </a>
    </div>

    <!-- Navigation Switch Tabs: QR코드 & URL단축 버튼 -->
    <nav class="nav-switch-tabs" aria-label="서비스 전환">
      <a href="index.html" class="tab-btn active" id="nav-btn-qr" title="QR코드 생성기 (현재 페이지)">
        <i class="fa-solid fa-qrcode"></i>
        <span>QR코드</span>
      </a>
      <a href="../urlShort/index.html" class="tab-btn" id="nav-btn-short" title="URL 단축기로 이동">
        <i class="fa-solid fa-scissors"></i>
        <span>URL단축</span>
      </a>
    </nav>

    <div class="header-tag">
      <span class="badge"><i class="fa-solid fa-sparkles"></i> Instant JPG Export</span>
    </div>
  </header>

  <!-- Main Interactive App Container -->
  <main class="app-container" id="app-container">
    
    <!-- Hero / Intro text (입력 전 중앙 노출) -->
    <div class="hero-section" id="hero-section">
      <h1 class="hero-title">어떤 링크든 <span class="gradient-text">QR코드</span>로 만들어보세요</h1>
      <p class="hero-subtitle">변환할 URL 주소를 입력하시면 정중앙에 고화질 QR코드가 바로 생성됩니다.</p>
    </div>

    <!-- Center Stage: QR Code Display Card (초기에는 숨김 / 생성 후 정중앙에 부드럽게 등장) -->
    <div class="qr-stage" id="qr-stage" aria-hidden="true">
      <div class="qr-card" id="qr-card" title="클릭하여 JPG로 다운로드">
        <div class="qr-card-inner">
          <!-- 실제 QR코드가 렌더링될 요소 -->
          <div id="qrcode-box" class="qrcode-box"></div>
          
          <!-- 호버 시 나타나는 감각적인 다운로드 오버레이 -->
          <div class="qr-hover-overlay">
            <div class="overlay-icon-wrap">
              <i class="fa-solid fa-cloud-arrow-down"></i>
            </div>
            <span class="overlay-text">클릭하여 JPG 다운로드</span>
          </div>
        </div>

        <!-- 하단 다운로드 안내 뱃지 바 -->
        <div class="qr-card-footer">
          <span class="action-tip"><i class="fa-solid fa-hand-pointer"></i> QR코드를 클릭하면 <strong>.jpg</strong>로 저장됩니다</span>
        </div>
      </div>
    </div>

    <!-- URL Input Form Section (초기: 중앙 -> 생성 후: 하단으로 부드럽게 이동) -->
    <div class="input-section" id="input-section">
      <form id="qr-form" class="qr-form" onsubmit="return false;">
        <div class="input-wrapper">
          <i class="fa-solid fa-link input-icon"></i>
          <input 
            type="text" 
            id="url-input" 
            class="url-input" 
            placeholder="https://example.com 형식의 URL을 입력해 주세요" 
            autocomplete="off"
            spellcheck="false"
            required
          >
          <button type="button" id="clear-btn" class="clear-btn" title="입력 지우기" aria-label="입력 지우기">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">
          <span>확인</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
      <div class="input-helper" id="input-helper">
        <span><i class="fa-solid fa-circle-info"></i> 엔터를 누르거나 '확인' 버튼을 클릭하면 QR코드가 바로 생성됩니다.</span>
      </div>
    </div>

  </main>

  <!-- Toast Notification (JPG 다운로드 시 피드백 알림) -->
  <div class="toast-notification" id="toast-notification">
    <div class="toast-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="toast-content">
      <p class="toast-title">다운로드 완료!</p>
      <p class="toast-desc">QR코드가 고화질 JPG 이미지로 저장되었습니다.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
